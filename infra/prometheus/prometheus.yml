# Placeholder static scrape list (wired up in M3): services run on the host via IDE / bootRun.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: readscape
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
          - host.docker.internal:8001
          - host.docker.internal:8002
          - host.docker.internal:8003
          - host.docker.internal:8004
