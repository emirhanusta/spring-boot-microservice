spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  # Routes arrive in M1: spring.cloud.gateway.server.webflux.routes

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
